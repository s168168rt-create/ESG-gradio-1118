<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>目前離線</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
         font-family:"Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
         background:linear-gradient(135deg,#0f766e,#2563eb);color:#fff;text-align:center}
    .box{max-width:420px}
    img{width:96px;height:96px;border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
    h1{margin:18px 0 8px;font-size:clamp(22px,6vw,28px)}
    p{margin:0 0 22px;opacity:.9;line-height:1.7}
    button{font:inherit;font-weight:600;color:#0f766e;background:#fff;border:0;border-radius:12px;
           padding:12px 28px;min-height:44px;cursor:pointer}
  </style>
</head>
<body>
  <div class="box">
    <img src="/static/icons/icon-192.png" alt="App 圖示">
    <h1>目前沒有網路連線</h1>
    <p>資料需要連線才能載入。<br>請確認網路後再試一次。</p>
    <button onclick="location.reload()">重新整理</button>
  </div>
</body>
</html>
